services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moment
      POSTGRES_USER: moment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moment -d moment"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: moment-photobooth:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://moment:${POSTGRES_PASSWORD:-moment}@db:5432/moment
      WEB_DIST: /app/dist
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MOMENT_DOMAIN: ${MOMENT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
